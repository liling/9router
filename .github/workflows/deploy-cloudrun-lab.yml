# Manual Phase-2 validation for Google Cloud Workload Identity Federation.
#
# Security properties:
# - no Google service-account JSON key is stored in GitHub
# - Google only accepts this repository + master branch + this workflow path
# - the impersonated service account can update only n9router-lab-hello
# - deployment continues to use the separate n9router-runtime identity

name: Deploy Cloud Run lab

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud with OIDC/WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: router-lab-512002
          workload_identity_provider: projects/1008887339236/locations/global/workloadIdentityPools/github-actions/providers/n9router-lab
          service_account: n9router-deployer@router-lab-512002.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: router-lab-512002
          version: '>= 363.0.0'

      - name: Show active cloud identity
        run: |
          gcloud auth list
          gcloud config set project router-lab-512002

      - name: Deploy one new revision of the existing private lab service
        run: |
          gcloud run deploy n9router-lab-hello \
            --project router-lab-512002 \
            --region us-west1 \
            --image us-docker.pkg.dev/cloudrun/container/hello:latest \
            --service-account n9router-runtime@router-lab-512002.iam.gserviceaccount.com \
            --no-allow-unauthenticated \
            --min-instances=0 \
            --max-instances=1 \
            --quiet

      - name: Show deployed revision
        run: |
          gcloud run services describe n9router-lab-hello \
            --project router-lab-512002 \
            --region us-west1 \
            --format='table(metadata.name,status.latestReadyRevisionName,status.url)'
